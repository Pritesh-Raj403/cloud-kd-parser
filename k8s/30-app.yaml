apiVersion: apps/v1
kind: Deployment
metadata: {name: nanoparse, namespace: app}
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector: {matchLabels: {app: nanoparse}}
  template:
    metadata: {labels: {app: nanoparse}}
    spec:
      containers:
        - name: nanoparse
          image: nanoparse-service:latest
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8000}]
          env:
            - {name: MODEL_URI, value: "s3://models/models/v1/"}
            - {name: MODEL_VERSION, value: "v1"}
            - {name: S3_ENDPOINT, value: "http://seaweedfs.data.svc:8333"}
            - {name: MAX_NEW_TOKENS, value: "64"}
          envFrom:
            - secretRef: {name: s3-creds}
          resources:
            requests: {cpu: 500m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          livenessProbe:
            httpGet: {path: /healthz, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /readyz, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata: {name: nanoparse, namespace: app}
spec:
  selector: {app: nanoparse}
  ports: [{port: 80, targetPort: 8000}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: nanoparse, namespace: app}
spec:
  rules:
    - http:
        paths:
          - path: /parse
            pathType: Prefix
            backend:
              service: {name: nanoparse, port: {number: 80}}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: nanoparse, namespace: app}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: nanoparse}
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
