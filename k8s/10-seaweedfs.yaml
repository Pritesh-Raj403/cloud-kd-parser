# SeaweedFS single-node, S3 gateway on 8333. Credentials come from the s3-creds Secret
# (created by scripts/create-secrets.sh, never committed).
apiVersion: apps/v1
kind: Deployment
metadata: {name: seaweedfs, namespace: data}
spec:
  replicas: 1
  selector: {matchLabels: {app: seaweedfs}}
  template:
    metadata: {labels: {app: seaweedfs}}
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:3.80
          args: ["server", "-dir=/data", "-s3", "-s3.config=/etc/s3/s3.json"]
          ports:
            - {containerPort: 8333, name: s3}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: s3conf, mountPath: /etc/s3}
      volumes:
        - name: data
          emptyDir: {}
        - name: s3conf
          secret: {secretName: s3-config}
---
apiVersion: v1
kind: Service
metadata: {name: seaweedfs, namespace: data}
spec:
  selector: {app: seaweedfs}
  ports:
    - {port: 8333, targetPort: 8333, name: s3}
