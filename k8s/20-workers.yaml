# Two parallel shard workers. OLLAMA_URL points to Ollama running on the laptop.
# On Linux Docker use the host's docker-network IP; on Mac/Windows use host.docker.internal / host.k3d.internal.
apiVersion: batch/v1
kind: Job
metadata: {name: worker-0, namespace: pipeline}
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: worker
          image: nanoparse-worker:latest
          imagePullPolicy: IfNotPresent
          env:
            - {name: SHARD_INDEX, value: "0"}
            - {name: SHARD_COUNT, value: "2"}
            - {name: S3_ENDPOINT, value: "http://seaweedfs.data.svc:8333"}
            - {name: OLLAMA_URL, value: "http://host.k3d.internal:11434"}
          envFrom:
            - secretRef: {name: s3-creds}
---
apiVersion: batch/v1
kind: Job
metadata: {name: worker-1, namespace: pipeline}
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: worker
          image: nanoparse-worker:latest
          imagePullPolicy: IfNotPresent
          env:
            - {name: SHARD_INDEX, value: "1"}
            - {name: SHARD_COUNT, value: "2"}
            - {name: S3_ENDPOINT, value: "http://seaweedfs.data.svc:8333"}
            - {name: OLLAMA_URL, value: "http://host.k3d.internal:11434"}
          envFrom:
            - secretRef: {name: s3-creds}
